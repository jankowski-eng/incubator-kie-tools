<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Popcorn DMN spike</title>
    <style>
      :root {
        --muted: #6b7280;
        --line: #8885;
        --accent: #2563eb;
        --k: #7c3aed;
        --n: #b45309;
        --s: #15803d;
        --c: #6b7280;
        --fn: #0e7490;
        --bad: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --muted: #9ca3af;
          --accent: #60a5fa;
          --k: #c4b5fd;
          --n: #fbbf24;
          --s: #4ade80;
          --c: #9ca3af;
          --fn: #22d3ee;
          --bad: #f87171;
        }
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 1rem;
        max-width: 1100px;
      }
      header {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 0.5rem;
      }
      header span {
        color: var(--muted);
        font-size: 0.85rem;
        margin-left: auto;
      }
      button {
        font: inherit;
        padding: 0.25rem 0.7rem;
      }
      svg {
        width: 100%;
        border: 1px solid var(--line);
        touch-action: none;
        user-select: none;
      }
      .node {
        cursor: grab;
      }
      .node .shape {
        fill: Canvas;
        stroke: currentColor;
        stroke-width: 1.2;
      }
      .node.sel .shape {
        stroke: var(--accent);
        stroke-width: 2.6;
      }
      .nv {
        fill: var(--muted);
      }
      #panel {
        margin-top: 1rem;
      }
      .hint {
        color: var(--muted);
      }
      table.boxed {
        border-collapse: collapse;
        width: 100%;
      }
      table.boxed th,
      table.boxed td {
        border: 1px solid var(--line);
        padding: 0;
        vertical-align: top;
      }
      table.boxed thead th {
        padding: 0.4rem 0.6rem;
        text-align: left;
        background: color-mix(in srgb, var(--accent) 12%, Canvas);
      }
      table.boxed small {
        font-weight: normal;
        color: var(--muted);
        margin-left: 0.4rem;
      }
      th.lbl {
        padding: 0.35rem 0.6rem;
        text-align: left;
        font:
          13px ui-monospace,
          monospace;
        white-space: nowrap;
        width: 1%;
      }
      td.val {
        padding: 0.35rem 0.6rem;
        width: 22%;
        font:
          13px ui-monospace,
          monospace;
      }
      td.val .bad,
      .hl .err {
        color: var(--bad);
      }
      td.val .warn {
        color: var(--muted);
        display: block;
        font: 11px system-ui;
      }
      .ed {
        position: relative;
        display: grid;
      }
      .ed pre.hl,
      .ed textarea {
        grid-area: 1 / 1;
        margin: 0;
        padding: 0.35rem 0.6rem;
        font:
          13px/1.5 ui-monospace,
          monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        border: 0;
        box-sizing: border-box;
      }
      .ed pre.hl {
        pointer-events: none;
      }
      .ed textarea {
        background: transparent;
        color: transparent;
        caret-color: CanvasText;
        resize: none;
        overflow: hidden;
        outline: none;
        width: 100%;
        height: 100%;
      }
      .ed:focus-within {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .hl .k {
        color: var(--k);
        font-weight: 600;
      }
      .hl .n {
        color: var(--n);
      }
      .hl .s {
        color: var(--s);
      }
      .hl .c {
        color: var(--c);
        font-style: italic;
      }
      .hl .fn {
        color: var(--fn);
      }
      .hl .op {
        color: var(--muted);
      }
      .hl .err {
        text-decoration: underline wavy var(--bad);
      }
      .hl .eof::after {
        content: "\00a0\00a0";
      }
      .ac {
        position: absolute;
        top: 100%;
        left: 0;
        z-index: 5;
      }
      .ac ul {
        list-style: none;
        margin: 0;
        padding: 2px;
        background: Canvas;
        border: 1px solid var(--line);
        box-shadow: 0 4px 12px #0003;
        font:
          13px ui-monospace,
          monospace;
      }
      .ac li {
        padding: 0.2rem 0.6rem;
        cursor: pointer;
      }
      .ac li:first-child {
        background: color-mix(in srgb, var(--accent) 18%, Canvas);
      }
      .ac li:hover {
        background: color-mix(in srgb, var(--accent) 28%, Canvas);
      }
      svg#drd {
        flex: 1;
        min-width: 0;
      }
      .canvas {
        display: flex;
        gap: 0.5rem;
        align-items: flex-start;
      }
      #palette {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        width: 9.5rem;
        flex: none;
      }
      #palette small {
        color: var(--muted);
        font-size: 0.72rem;
        line-height: 1.3;
      }
      .pal {
        border: 1.2px solid currentColor;
        padding: 0.5rem 0.4rem;
        text-align: center;
        font-size: 0.8rem;
        cursor: grab;
        background: Canvas;
      }
      .pal.input {
        border-radius: 999px;
      }
      .pal.bkm {
        clip-path: polygon(14px 0, 100% 0, 100% 100%, 0 100%, 0 14px);
        border-color: transparent;
        background: color-mix(in srgb, currentColor 14%, Canvas);
      }
      .tabs {
        display: flex;
        margin-right: 0.75rem;
      }
      .tabs button {
        border-radius: 0;
      }
      .tabs button[aria-pressed="true"] {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
      }
      .node .handle {
        display: none;
        fill: var(--accent);
        stroke: Canvas;
        stroke-width: 2;
        cursor: crosshair;
      }
      .node.sel .handle {
        display: block;
      }
      .node.invalid .shape {
        stroke: var(--bad);
        stroke-dasharray: 5 3;
      }
      .edge .hit {
        stroke: transparent;
        stroke-width: 12;
        cursor: pointer;
      }
      .edge.sel .vis {
        stroke: var(--accent);
        stroke-width: 2.6;
      }
      #preview {
        pointer-events: none;
      }
      .nodehead {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 0.4rem;
      }
      .nodehead .nname {
        font: 600 15px system-ui;
        padding: 0.25rem 0.4rem;
        min-width: 14rem;
      }
      .nodehead select {
        font: inherit;
      }
      .errs {
        color: var(--bad);
        font-size: 0.85rem;
      }
      table.types {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px;
      }
      table.types th,
      table.types td {
        border: 1px solid var(--line);
        padding: 0.2rem 0.4rem;
        vertical-align: top;
        text-align: left;
      }
      table.types thead th {
        background: color-mix(in srgb, var(--accent) 12%, Canvas);
      }
      table.types input[data-op="tname"] {
        font:
          13px ui-monospace,
          monospace;
        width: 100%;
        box-sizing: border-box;
      }
      table.types td.cons {
        min-width: 16rem;
      }
      table.types td.cons select {
        margin-bottom: 0.2rem;
      }
      table.types small.bad {
        color: var(--bad);
        display: block;
      }
      table.types td.acts {
        white-space: nowrap;
        width: 1%;
      }
      [hidden] {
        display: none !important;
      }
      table.dt th.hp {
        width: 1%;
        white-space: nowrap;
        vertical-align: middle;
      }
      table.dt th.hp select {
        font: 600 12px system-ui;
      }
      table.dt th.in {
        min-width: 9rem;
        font-weight: normal;
      }
      table.dt th.in button,
      table.dt td.rm button {
        font-size: 11px;
        padding: 0 0.3rem;
        opacity: 0.6;
      }
      table.dt td.rn {
        text-align: center;
        color: var(--muted);
        font:
          12px ui-monospace,
          monospace;
        width: 1%;
        padding: 0.35rem 0.5rem;
        vertical-align: middle;
      }
      table.dt td.rm {
        vertical-align: middle;
        width: 1%;
      }
      table.dt td.out .ed {
        background: color-mix(in srgb, var(--accent) 6%, Canvas);
      }
      table.dt tr.rule.hit td {
        background: color-mix(in srgb, var(--accent) 14%, Canvas);
      }
      table.dt tr.rule.hit td.rn {
        color: var(--accent);
        font-weight: 700;
      }
      table.dt tfoot td {
        padding: 0.35rem 0.5rem;
        border: 0;
      }
      table.dt .dtv {
        margin-left: 0.75rem;
        font:
          13px ui-monospace,
          monospace;
      }
      table.dt .dtv .warn {
        font: 12px system-ui;
        color: var(--bad);
      }
      label.file span {
        display: inline-block;
        font: inherit;
        padding: 0.25rem 0.7rem;
        border: 1px solid var(--line);
        border-radius: 3px;
        cursor: pointer;
        background: ButtonFace;
        color: ButtonText;
      }
      .report {
        font-size: 0.85rem;
        margin: 0.4rem 0;
        padding: 0.4rem 0.7rem;
        border-left: 3px solid var(--accent);
        background: color-mix(in srgb, var(--accent) 8%, Canvas);
      }
      .report:empty {
        display: none;
      }
      .report .bad {
        color: var(--bad);
      }
      .report ul.dropped {
        margin: 0.25rem 0 0;
        padding-left: 1.2rem;
        color: var(--muted);
      }
      #xml {
        margin: 0;
        padding: 0.6rem;
        border: 1px solid var(--line);
        overflow: auto;
        font:
          12px/1.45 ui-monospace,
          monospace;
        max-height: 75vh;
      }
      .canvas {
        position: relative;
      }
      .zoomctl {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 2;
        display: flex;
        gap: 2px;
      }
      .zoomctl button {
        min-width: 1.9rem;
        padding: 0.15rem 0.45rem;
      }
      svg#drd {
        cursor: grab;
      }
      header {
        flex-wrap: wrap;
        row-gap: 0.4rem;
      }
      header #status {
        flex: 1 1 14rem;
        min-width: 0;
        text-align: right;
        margin-left: auto;
      }
      table.dt th.outh {
        min-width: 8rem;
        font-weight: normal;
      }
      table.dt td.out {
        min-width: 8rem;
      }
      table.dt th.noteh {
        width: 12%;
      }
      table.dt td.note {
        width: 12%;
        padding: 0.2rem;
        vertical-align: top;
      }
      table.dt td.note input {
        width: 100%;
        box-sizing: border-box;
        font: 12px system-ui;
        border: 1px solid var(--line);
        background: transparent;
        color: inherit;
        padding: 0.2rem 0.3rem;
      }
      input.params {
        font:
          13px ui-monospace,
          monospace;
        width: 14rem;
      }
    </style>
  </head>
  <body>
    <header>
      <nav class="tabs">
        <button data-click="tab:editor" aria-pressed="true">Editor</button>
        <button data-click="tab:types" aria-pressed="false">Data types</button>
        <button data-click="tab:xml" aria-pressed="false">XML</button>
      </nav>
      <button data-click="undo" disabled>↶ Undo</button><button data-click="redo" disabled>↷ Redo</button>
      <button data-click="layout" title="Arrange nodes in layers">Auto-layout</button>
      <label class="file" title="Open a .dmn file"
        ><span>Import…</span><input id="file" type="file" accept=".dmn,.xml" hidden
      /></label>
      <button data-click="export" title="Download DMN XML">Export</button>
      <span id="status">Starting Popcorn...</span>
    </header>
    <div id="report" class="report"></div>
    <section id="view-editor">
      <div class="canvas">
        <div id="palette" title="Drag onto the canvas">
          <div class="pal decision" draggable="true" data-kind="decision">Decision</div>
          <div class="pal input" draggable="true" data-kind="input">Input data</div>
          <div class="pal bkm" draggable="true" data-kind="bkm">Business knowledge</div>
          <small
            >Drag onto the canvas. Drag a selected node's top handle onto another node to connect. Delete removes the
            selection.</small
          >
        </div>
        <div class="zoomctl">
          <button data-click="zoom-in" title="Zoom in">+</button
          ><button data-click="zoom-out" title="Zoom out">−</button
          ><button data-click="fit" title="Fit diagram">Fit</button>
        </div>
        <svg id="drd" viewBox="0 0 820 370">
          <defs>
            <marker
              id="arrow-fill"
              viewBox="0 0 10 10"
              refX="10"
              refY="5"
              markerWidth="9"
              markerHeight="9"
              orient="auto-start-reverse"
            >
              <path d="M0 0L10 5L0 10z" fill="currentColor" />
            </marker>
            <marker
              id="arrow-open"
              viewBox="0 0 10 10"
              refX="10"
              refY="5"
              markerWidth="9"
              markerHeight="9"
              orient="auto-start-reverse"
            >
              <path d="M0 0L10 5L0 10" fill="none" stroke="currentColor" stroke-width="1.4" />
            </marker>
          </defs>
          <g id="scene"></g>
          <g id="preview"></g>
        </svg>
      </div>
      <div id="panel"></div>
    </section>
    <section id="view-types" hidden><div id="types"></div></section>
    <section id="view-xml" hidden><pre id="xml"></pre></section>
    <script type="module">
      import { Popcorn } from "./out/index.mjs";
      const t0 = performance.now();
      try {
        await Popcorn.init({
          onStdout: console.log,
          onStderr: console.error,
          timeoutsMs: { boot: 120000, appStartup: 120000 },
        });
        console.log(`popcorn booted in ${Math.round(performance.now() - t0)} ms`);
        document.title = "BOOTED";
      } catch (e) {
        document.querySelector("#status").textContent = "Popcorn failed: " + (e && (e.message || JSON.stringify(e)));
        document.title = "FAILED";
      }
    </script>
  </body>
</html>
